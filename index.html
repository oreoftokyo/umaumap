<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>グルメ共有</title>

<style>
body { font-family:sans-serif; background:#f5f8fa; padding:10px;}
h1 { text-align:center; color:#1DA1F2;}
input, select { width:100%; padding:12px; margin:5px 0; font-size:16px;}
button { padding:10px; margin:5px 5px 0 0; border:none; border-radius:8px; background:#1DA1F2; color:white;}
.card { background:white; margin:10px 0; padding:12px; border-radius:10px;}
.done { opacity:0.5; }
</style>
</head>

<body>

<h1>グルメ共有</h1>

<!-- フィルター -->
<select id="areaFilter" onchange="render()">
  <option value="">すべてのエリア</option>
</select>

<select id="genreFilter" onchange="render()">
  <option value="">すべてのジャンル</option>
  <option>和食</option>
  <option>洋食</option>
  <option>中華</option>
  <option>スイーツ</option>
  <option>その他</option>
</select>

<hr>

<!-- 入力フォーム -->
<input id="name" placeholder="店名">
<input id="area" placeholder="エリア">

<select id="genre">
  <option value="">ジャンル選択</option>
  <option>和食</option>
  <option>洋食</option>
  <option>中華</option>
  <option>スイーツ</option>
  <option>その他</option>
</select>

<input id="map" placeholder="GoogleマップURL">

<button onclick="add()" id="mainBtn">追加</button>

<hr>

<div id="list"></div>

<script>

let data = JSON.parse(localStorage.getItem("gmap") || "[]");
let editId = null;

function save() {
  localStorage.setItem("gmap", JSON.stringify(data));
}

// フィルター更新
function updateFilters() {
  const set = new Set(data.map(d => d.area).filter(Boolean));
  areaFilter.innerHTML = '<option value="">すべてのエリア</option>';

  Array.from(set).sort((a,b)=>a.localeCompare(b,'ja')).forEach(a=>{
    areaFilter.innerHTML += `<option>${a}</option>`;
  });
}

// 追加＆更新
function add() {

  if (!name.value || !map.value) return;

  if (editId) {
    const item = data.find(d => d.id === editId);
    item.name = name.value;
    item.area = area.value;
    item.genre = genre.value;
    item.map = map.value;
    editId = null;
  } else {
    data.push({
      id: Date.now(),
      name: name.value,
      area: area.value,
      genre: genre.value,
      map: map.value,
      done:false
    });
  }

  save();
  updateFilters();
  render();

  name.value = "";
  area.value = "";
  genre.value = "";
  map.value = "";

  mainBtn.textContent = "追加";
}

// 編集（フォームに入れる）
function editItem(id) {
  const item = data.find(d => d.id === id);

  name.value = item.name;
  area.value = item.area;
  genre.value = item.genre;
  map.value = item.map;

  editId = id;
  mainBtn.textContent = "更新";
}

// 削除
function deleteItem(id) {
  if (!confirm("削除しますか？")) return;

  data = data.filter(d => d.id !== id);
  save();
  updateFilters();
  render();
}

// 行ったチェック
function toggleDone(id) {
  const item = data.find(d => d.id === id);
  item.done = !item.done;
  save();
  render();
}

// 表示
function render() {

  const areaF = areaFilter.value;
  const genreF = genreFilter.value;

  let filtered = data.filter(d =>
    (!areaF || d.area === areaF) &&
    (!genreF || d.genre === genreF)
  );

  filtered.sort((a,b)=>{
    if (a.area !== b.area) return a.area.localeCompare(b.area,'ja');
    return a.name.localeCompare(b.name,'ja');
  });

  list.innerHTML = "";

  filtered.forEach(d=>{
    list.innerHTML += `
      <div class="card ${d.done ? 'done':''}">
        <b>${d.name}</b><br>
        ${d.area} / ${d.genre}<br>
        <a href="${d.map}" target="_blank">地図</a><br><br>

        <button onclick="toggleDone(${d.id})">
          ${d.done ? '行った✓' : '行く'}
        </button>

        <button onclick="editItem(${d.id})">編集</button>
        <button onclick="deleteItem(${d.id})">削除</button>
      </div>
    `;
  });

  mainBtn.textContent = editId ? "更新" : "追加";
}

// 初期化
updateFilters();
render();

</script>

</body>
</html>
