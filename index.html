<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>グルメ共有</title>

<style>
body { font-family:sans-serif; background:#f5f8fa; padding:10px;}
.card { background:white; margin:10px 0; padding:10px;}
.done { opacity:0.5; }
</style>
</head>

<body>

<h1>グルメ共有</h1>

<input id="name" placeholder="店名">
<input id="area" placeholder="エリア">

<select id="genre">
<option>和食</option>
<option>洋食</option>
<option>中華</option>
<option>スイーツ</option>
<option>その他</option>
</select>

<input id="map" placeholder="URL">
<button onclick="add()">追加</button>

<div id="list"></div>

<script>

let data = JSON.parse(localStorage.getItem("gmap") || "[]");

function save() {
  localStorage.setItem("gmap", JSON.stringify(data));
}

function add() {
  data.push({
    id: Date.now(),
    name: name.value,
    area: area.value,
    genre: genre.value,
    map: map.value,
    done:false
  });

  save();
  render();
}

function toggleDone(id) {
  const item = data.find(d => d.id === id);
  item.done = !item.done;
  save();
  render();
}

function editItem(id) {
  const item = data.find(d => d.id === id);

  item.name = prompt("店名", item.name);
  item.area = prompt("エリア", item.area);
  item.genre = prompt("ジャンル", item.genre);
  item.map = prompt("URL", item.map);

  save();
  render();
}

function deleteItem(id) {
  data = data.filter(d => d.id !== id);
  save();
  render();
}

function render() {

  let sorted = [...data].sort((a,b)=>a.area.localeCompare(b.area,'ja'));

  list.innerHTML = "";

  sorted.forEach(d=>{
    list.innerHTML += `
      <div class="card ${d.done ? 'done':''}">
        <b>${d.name}</b><br>
        ${d.area} / ${d.genre}<br>
        <a href="${d.map}" target="_blank">地図</a><br>

        <button onclick="toggleDone(${d.id})">
          ${d.done ? '行った✓' : '行く'}
        </button>

        <button onclick="editItem(${d.id})">編集</button>
        <button onclick="deleteItem(${d.id})">削除</button>
      </div>
    `;
  });
}

render();

</script>

</body>
</html>
