<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>グルメ共有</title>

<style>
body {
  font-family: sans-serif;
  background: #f5f8fa;
  margin: 0;
  padding: 10px;
}

h1 {
  text-align: center;
  color: #1DA1F2;
}

input {
  width: 100%;
  padding: 12px;
  margin: 5px 0;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  background: #1DA1F2;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
}

.card {
  background: white;
  margin: 10px 0;
  padding: 12px;
  border-radius: 12px;
}

.area {
  font-size: 12px;
  color: gray;
}
</style>
</head>

<body>

<h1>グルメ共有</h1>

<!-- 入力フォーム -->
<input id="name" placeholder="店名">
<input id="area" placeholder="エリア">
<input id="map" placeholder="GoogleマップURL">
<button onclick="add()">追加</button>

<hr>

<!-- 表示 -->
<div id="list"></div>

<script>

let data = JSON.parse(localStorage.getItem("gmap") || "[]");

function save() {
  localStorage.setItem("gmap", JSON.stringify(data));
}

function add() {
  const item = {
    name: document.getElementById("name").value,
    area: document.getElementById("area").value,
    map: document.getElementById("map").value
  };

  if (!item.name || !item.map) return;

  data.push(item);
  save();
  render();

  document.getElementById("name").value = "";
  document.getElementById("area").value = "";
  document.getElementById("map").value = "";
}

function render() {
  const list = document.getElementById("list");

  data.sort((a, b) => {
    if (a.area !== b.area) {
      return a.area.localeCompare(b.area, 'ja');
    }
    return a.name.localeCompare(b.name, 'ja');
  });

  list.innerHTML = "";

  let currentArea = "";

  data.forEach(d => {
    if (d.area !== currentArea) {
      currentArea = d.area;
      const h = document.createElement("h3");
      h.textContent = currentArea;
      list.appendChild(h);
    }

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${d.name}</b><br>
      <span class="area">${d.area}</span><br>
      <a href="${d.map}" target="_blank">地図で見る</a>
    `;

    list.appendChild(div);
  });
}

render();

</script>

</body>
</html>
