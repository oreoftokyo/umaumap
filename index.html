<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>グルメ共有</title>

<style>
body { font-family: sans-serif; background:#f5f8fa; padding:10px;}
h1 { text-align:center; color:#1DA1F2;}
input, select { width:100%; padding:12px; margin:5px 0;}
button { padding:10px; margin:5px 5px 0 0;}
.card { background:white; margin:10px 0; padding:12px; border-radius:10px;}
.done { opacity:0.5; }
</style>
</head>

<body>

<h1>グルメ共有</h1>

<select id="areaFilter" onchange="render()">
  <option value="">すべてのエリア</option>
</select>

<select id="genreFilter" onchange="render()">
  <option value="">すべてのジャンル</option>
  <option>和食</option>
  <option>洋食</option>
  <option>中華</option>
  <option>スイーツ</option>
  <option>その他</option>
</select>

<hr>

<input id="name" placeholder="店名">
<input id="area" placeholder="エリア">

<select id="genre">
  <option value="">ジャンル</option>
  <option>和食</option>
  <option>洋食</option>
  <option>中華</option>
  <option>スイーツ</option>
  <option>その他</option>
</select>

<input id="map" placeholder="GoogleマップURL">
<button onclick="add()">追加</button>

<hr>

<div id="list"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>

<script>

// ★ここにあとでFirebase設定を入れる

let db;
let data = [];

// 初期化後に呼ぶ
function startApp(database) {
  db = database;

  // リアルタイム取得
  db.collection("shops").onSnapshot(snapshot => {
    data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    updateFilters();
    render();
  });
}

// 追加
function add() {
  if (!name.value || !map.value) return;

  db.collection("shops").add({
    name: name.value,
    area: area.value,
    genre: genre.value,
    map: map.value,
    done: false
  });

  name.value = "";
  area.value = "";
  genre.value = "";
  map.value = "";
}

// 行ったチェック
function toggleDone(id, current) {
  db.collection("shops").doc(id).update({
    done: !current
  });
}

// 編集
function editItem(id) {
  const item = data.find(d => d.id === id);

  const n = prompt("店名", item.name);
  const a = prompt("エリア", item.area);
  const g = prompt("ジャンル", item.genre);
  const m = prompt("URL", item.map);

  db.collection("shops").doc(id).update({
    name: n,
    area: a,
    genre: g,
    map: m
  });
}

// 削除
function deleteItem(id) {
  if (!confirm("削除しますか？")) return;
  db.collection("shops").doc(id).delete();
}

// フィルター生成
function updateFilters() {
  const set = new Set(data.map(d => d.area).filter(Boolean));
  areaFilter.innerHTML = '<option value="">すべて</option>';

  Array.from(set).sort().forEach(a => {
    areaFilter.innerHTML += `<option>${a}</option>`;
  });
}

// 表示
function render() {
  const areaF = areaFilter.value;
  const genreF = genreFilter.value;

  let filtered = data.filter(d =>
    (!areaF || d.area === areaF) &&
    (!genreF || d.genre === genreF)
  );

  filtered.sort((a,b)=>a.area.localeCompare(b.area,'ja'));

  list.innerHTML = "";

  filtered.forEach(d => {
    list.innerHTML += `
      <div class="card ${d.done ? 'done':''}">
        <b>${d.name}</b><br>
        ${d.area} / ${d.genre}<br>
        <a href="${d.map}" target="_blank">地図</a><br><br>

        <button onclick="toggleDone('${d.id}', ${d.done})">
          ${d.done ? '行った✓' : '行く'}
        </button>

        <button onclick="editItem('${d.id}')">編集</button>
        <button onclick="deleteItem('${d.id}')">削除</button>
      </div>
    `;
  });
}

</script>

</body>
</html>
