<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>グルメ共有</title>

<style>
body { font-family: sans-serif; background:#f5f8fa; padding:10px;}
h1 { text-align:center; color:#1DA1F2;}
input, select { width:100%; padding:12px; margin:5px 0;}
button { padding:10px; margin:5px 5px 0 0;}
.card { background:white; margin:10px 0; padding:12px; border-radius:10px;}
</style>
</head>

<body>

<h1>グルメ共有</h1>

<!-- フィルター -->
<select id="areaFilter" onchange="render()">
  <option value="">すべてのエリア</option>
</select>

<select id="genreFilter" onchange="render()">
  <option value="">すべてのジャンル</option>
  <option>和食</option>
  <option>洋食</option>
  <option>中華</option>
  <option>スイーツ</option>
  <option>その他</option>
</select>

<hr>

<!-- 入力 -->
<input id="name" placeholder="店名">
<input id="area" placeholder="エリア">

<select id="genre">
  <option value="">ジャンル</option>
  <option>和食</option>
  <option>洋食</option>
  <option>中華</option>
  <option>スイーツ</option>
  <option>その他</option>
</select>

<input id="map" placeholder="GoogleマップURL">
<button onclick="add()">追加</button>

<hr>

<div id="list"></div>

<script>

let data = JSON.parse(localStorage.getItem("gmap") || "[]");

function save() {
  localStorage.setItem("gmap", JSON.stringify(data));
}

// ★エリアプルダウン生成
function updateFilters() {
  const areaSet = new Set(data.map(d => d.area).filter(Boolean));
  const areaFilter = document.getElementById("areaFilter");

  areaFilter.innerHTML = '<option value="">すべてのエリア</option>';

  Array.from(areaSet).sort((a,b)=>a.localeCompare(b,'ja')).forEach(a => {
    const opt = document.createElement("option");
    opt.value = a;
    opt.textContent = a;
    areaFilter.appendChild(opt);
  });
}

function add() {
  const item = {
    id: Date.now(),
    name: name.value,
    area: area.value,
    genre: genre.value,
    map: map.value
  };

  if (!item.name || !item.map) return;

  data.push(item);
  save();
  updateFilters();
  render();

  name.value = "";
  area.value = "";
  genre.value = "";
  map.value = "";
}

function render() {
  const list = document.getElementById("list");

  const areaF = document.getElementById("areaFilter").value;
  const genreF = document.getElementById("genreFilter").value;

  // ★フィルター
  let filtered = data.filter(d => {
    return (!areaF || d.area === areaF) &&
           (!genreF || d.genre === genreF);
  });

  // ソート
  filtered.sort((a, b) => {
    if (a.area !== b.area) return a.area.localeCompare(b.area,'ja');
    return a.name.localeCompare(b.name,'ja');
  });

  list.innerHTML = "";

  filtered.forEach(d => {
    list.innerHTML += `
      <div class="card">
        <b>${d.name}</b><br>
        ${d.area} / ${d.genre}<br>
        <a href="${d.map}" target="_blank">地図</a>
      </div>
    `;
  });
}

// 初期化
updateFilters();
render();

</script>

</body>
</html>
