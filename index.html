<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ウマウマップ</title>

<style>
body { font-family: sans-serif; background:#f5f8fa; padding:10px; }
h1 { text-align:center; color:#1DA1F2; }

input, select {
  width:100%;
  padding:12px;
  margin:5px 0;
  font-size:16px;
}

button {
  padding:10px;
  margin:5px 5px 0 0;
  border:none;
  border-radius:8px;
  background:#1DA1F2;
  color:white;
  cursor:pointer;
}

.card {
  background:white;
  margin:10px 0;
  padding:12px;
  border-radius:10px;
}

.done { opacity:0.5; }
a { color:#1DA1F2; }
</style>
</head>

<body>

<h1>グルメ共有</h1>

<!-- フィルター -->
<select id="areaFilter" onchange="render()">
  <option value="">すべてのエリア</option>
</select>

<select id="genreFilter" onchange="render()">
  <option value="">すべてのジャンル</option>
  <option>和食</option>
  <option>洋食</option>
  <option>中華</option>
  <option>スイーツ</option>
  <option>その他</option>
</select>

<hr>

<!-- 入力 -->
<input id="name" placeholder="店名">
<input id="area" placeholder="エリア">

<select id="genre">
  <option value="">ジャンル選択</option>
  <option>和食</option>
  <option>洋食</option>
  <option>中華</option>
  <option>スイーツ</option>
  <option>その他</option>
</select>

<input id="map" placeholder="GoogleマップURL">

<button onclick="add()" id="mainBtn">追加</button>

<hr>

<div id="list"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// ===== Firebase設定 =====
const firebaseConfig = {
  apiKey: "AIzaSyBIy1VgLDZ9ZJR3LJpHTbmRW8wzIyqz_0",
  authDomain: "my-gourmet-app-677a8.firebaseapp.com",
  projectId: "my-gourmet-app-677a8",
  storageBucket: "my-gourmet-app-677a8.firebasestorage.app",
  messagingSenderId: "322555695182",
  appId: "1:322555695182:web:effc9c3999e3cdbfa1b31f",
  measurementId: "G-59D8F0HR21"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const col = collection(db, "gourmet");

// ===== 状態 =====
let data = [];
let editId = null;

// ===== DOM =====
const nameEl = document.getElementById("name");
const areaEl = document.getElementById("area");
const genreEl = document.getElementById("genre");
const mapEl = document.getElementById("map");
const listEl = document.getElementById("list");
const mainBtn = document.getElementById("mainBtn");

const areaFilter = document.getElementById("areaFilter");
const genreFilter = document.getElementById("genreFilter");

// ===== データ取得 =====
async function loadData() {
  const snap = await getDocs(col);
  data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  updateFilters();
  render();
}

// ===== フィルター更新 =====
function updateFilters() {
  const set = new Set(data.map(d => d.area).filter(Boolean));

  areaFilter.innerHTML = '<option value="">すべてのエリア</option>';
  [...set].sort((a,b)=>a.localeCompare(b,'ja')).forEach(a=>{
    areaFilter.innerHTML += `<option>${a}</option>`;
  });
}

// ===== 追加・更新 =====
async function add() {
  if (!nameEl.value || !mapEl.value) return;

  if (editId) {
    await updateDoc(doc(db, "gourmet", editId), {
      name: nameEl.value,
      area: areaEl.value,
      genre: genreEl.value,
      map: mapEl.value
    });
    editId = null;
  } else {
    await addDoc(col, {
      name: nameEl.value,
      area: areaEl.value,
      genre: genreEl.value,
      map: mapEl.value,
      done: false,
      createdAt: Date.now()
    });
  }

  clearForm();
  loadData();
}

// ===== 削除 =====
async function deleteItem(id) {
  if (!confirm("削除しますか？")) return;
  await deleteDoc(doc(db, "gourmet", id));
  loadData();
}

// ===== 編集 =====
function editItem(id) {
  const item = data.find(d => d.id === id);

  nameEl.value = item.name;
  areaEl.value = item.area;
  genreEl.value = item.genre;
  mapEl.value = item.map;

  editId = id;
  mainBtn.textContent = "更新";
}

// ===== 行ったチェック =====
async function toggleDone(id) {
  const item = data.find(d => d.id === id);

  await updateDoc(doc(db, "gourmet", id), {
    done: !item.done
  });

  loadData();
}

// ===== 表示 =====
function render() {
  const areaF = areaFilter.value;
  const genreF = genreFilter.value;

  let filtered = data.filter(d =>
    (!areaF || d.area === areaF) &&
    (!genreF || d.genre === genreF)
  );

  filtered.sort((a,b)=>{
    if (a.area !== b.area) return a.area.localeCompare(b.area,'ja');
    return a.name.localeCompare(b.name,'ja');
  });

  listEl.innerHTML = "";

  filtered.forEach(d=>{
    listEl.innerHTML += `
      <div class="card ${d.done ? 'done':''}">
        <b>${d.name}</b><br>
        ${d.area || ""} / ${d.genre || ""}<br>
        <a href="${d.map}" target="_blank">地図</a><br><br>

        <button onclick="toggleDone('${d.id}')">
          ${d.done ? '行った✓' : '行く'}
        </button>

        <button onclick="editItem('${d.id}')">編集</button>
        <button onclick="deleteItem('${d.id}')">削除</button>
      </div>
    `;
  });

  mainBtn.textContent = editId ? "更新" : "追加";
}

// ===== フォームクリア =====
function clearForm() {
  nameEl.value = "";
  areaEl.value = "";
  genreEl.value = "";
  mapEl.value = "";
}

// ===== グローバル公開（重要）=====
window.add = add;
window.deleteItem = deleteItem;
window.editItem = editItem;
window.toggleDone = toggleDone;
window.render = render;

// ===== 初期化 =====
loadData();

</script>

</body>
</html>
